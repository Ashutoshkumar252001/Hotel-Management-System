<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #27ae60;
            border: none;
            color: white;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>
<body>

<div class="container">

    <h2 th:text="${room.id == null ? 'Add Room' : 'Edit Room'}"></h2>

    <form th:action="@{/room/save}"
          th:object="${room}"
          method="post">

        <!-- hidden id -->
        <input type="hidden" th:field="*{id}"/>

        <label>Room Number</label>
        <input type="number"
               th:field="*{roomNumber}"
               required/>

        <label>Room Type</label>
        <input type="text"
               th:field="*{type}"
               placeholder="AC / NON-AC / DELUXE"
               required/>

        <label>Price Per Night</label>
        <input type="number"
               step="0.01"
               th:field="*{pricePerNight}"
               required/>

        <label>Status</label>
        <select th:field="*{status}" required>
            <option value="">-- Select Status --</option>
            <option value="AVAILABLE">AVAILABLE</option>
            <option value="BOOKED">BOOKED</option>
            <option value="MAINTENANCE">MAINTENANCE</option>
        </select>

        <button type="submit"
                th:text="${room.id == null ? 'Save Room' : 'Update Room'}">
        </button>

        <a th:href="@{/room/list}">Cancel</a>

    </form>

</div>

</body>
</html>
