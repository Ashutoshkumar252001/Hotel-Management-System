<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room Form</title>

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
            --success: #22c55e;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
        }

        .container {
            width: 420px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 18px;
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.12);
            color: var(--text-light);
            outline: none;
            font-size: 14px;
        }

        input::placeholder {
            color: #cbd5f5;
        }

        select option {
            color: #000;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56,189,248,0.3);
        }

        button {
            margin-top: 25px;
            padding: 12px;
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 999px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(34,197,94,0.45);
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: var(--accent);
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <h2 th:text="${room.id == null ? 'Add Room' : 'Edit Room'}"></h2>

    <form th:action="@{/admin/room/save}"
          th:object="${room}"
          method="post">

        <!-- hidden id -->
        <input type="hidden" th:field="*{id}"/>

        <label>Hotel</label>
        <select th:field="*{hotel.id}" required>
            <option value="">-- Select Hotel --</option>
            <option th:each="t : ${hotels}"
                    th:value="${t.id}"
                    th:text="${t.name}">
            </option>
        </select>

        <label>Room Number</label>
        <input type="number"
               th:field="*{roomNumber}"
               required />

        <label>Room Type</label>
        <input type="text"
               th:field="*{type}"
               placeholder="AC / NON-AC / DELUXE"
               required />

        <label>Price Per Night</label>
        <input type="number"
               step="0.01"
               min="100"
               th:field="*{pricePerNight}"
               required />

        <label>Status</label>
        <select th:field="*{status}" required>
            <option value="">-- Select Status --</option>
            <option value="AVAILABLE">AVAILABLE</option>
            <option value="BOOKED">BOOKED</option>
            <option value="MAINTENANCE">MAINTENANCE</option>
        </select>

        <button type="submit"
                th:text="${room.id == null ? 'Save Room' : 'Update Room'}">
        </button>

        <a th:href="@{/admin/room/list}">Cancel</a>

    </form>

</div>

</body>
</html>
