<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Management</title>

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #facc15;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-light);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .success { color: var(--success); }
        .error { color: var(--danger); }

        .top-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .add-btn,
        .home-btn {
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            box-shadow: 0 6px 18px rgba(56,189,248,0.4);
        }

        .home-btn {
            background: linear-gradient(135deg, #64748b, #475569);
        }

        .add-btn:hover,
        .home-btn:hover {
            transform: scale(1.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        th, td {
            padding: 14px;
            text-align: center;
        }

        th {
            background: rgba(0,0,0,0.4);
            font-size: 15px;
        }

        tr:not(:last-child) {
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(255,255,255,0.05);
        }

        .edit {
            background: linear-gradient(135deg, var(--warning), #eab308);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            color: black;
            margin-right: 6px;
            display: inline-block;
        }

        .delete {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit:hover,
        .delete:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<h2>🏨 Hotel Management</h2>

<p th:if="${success}" th:text="${success}" class="message success"></p>
<p th:if="${error}" th:text="${error}" class="message error"></p>

<div class="top-bar">
    <a th:href="@{/hotel/new}" class="add-btn">➕ New Hotel</a>
    <a th:href="@{/}" class="home-btn">🏠 Home</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Hotel Name</th>
        <th>Address</th>
        <th>Rating</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="h : ${hotels}">
        <td th:text="${h.id}"></td>
        <td th:text="${h.name}"></td>
        <td th:text="${h.address}"></td>
        <td th:text="${h.rating}"></td>

        <td>
            <a th:href="@{/hotel/edit/{id}(id=${h.id})}" class="edit">✏ Edit</a>

            <form th:action="@{/hotel/delete/{id}(id=${h.id})}"
                  method="post"
                  onsubmit="return confirm('Are you sure?')"
                  style="display:inline;">

                <input type="hidden" name="_method" value="DELETE"/>

                <button type="submit" class="delete">🗑 Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
