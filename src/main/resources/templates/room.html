<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room Management</title>

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-light);
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .success { color: #22c55e; }
        .error { color: #ef4444; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(56,189,248,0.4);
        }

        .home-btn {
            text-decoration: none;
            font-weight: bold;
            color: var(--accent);
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(255,255,255,0.12);
            padding: 14px;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.6px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        tr:hover {
            background: rgba(255,255,255,0.06);
        }

        a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .edit {
            background: #facc15;
            padding: 6px 12px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
        }

        .delete-btn {
            background: #ef4444;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .price {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>🛏 Room Management</h2>

<p th:if="${success}" th:text="${success}" class="message success"></p>
<p th:if="${error}" th:text="${error}" class="message error"></p>

<div class="top-bar">
    <a th:href="@{/admin/room/new}" class="add-btn">➕ Add Room</a>
    <a th:href="@{/}" class="home-btn">🏠 Home</a>
</div>

<div class="table-container">

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Room No</th>
            <th>Type</th>
            <th>Price / Night</th>
            <th>Hotel</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="r : ${rooms}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.roomNumber}"></td>
            <td th:text="${r.type}"></td>
            <td class="price">₹ <span th:text="${r.pricePerNight}"></span></td>

            <td>
                <a th:href="@{/admin/hotel/find/{id}(id=${r.hotelModel.id})}"
                   th:text="${r.hotelModel.name}">
                </a>
            </td>

            <td>
                <a th:href="@{/admin/room/edit/{id}(id=${r.id})}" class="edit">✏ Edit</a>

                <form th:action="@{/admin/room/delete/{id}(id=${r.id})}"
                      method="post"
                      style="display:inline;"
                      onsubmit="return confirm('Delete this room?')">

                    <input type="hidden" name="_method" value="delete"/>

                    <button type="submit" class="delete-btn">🗑 Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
