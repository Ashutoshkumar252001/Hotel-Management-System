<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .success { color: green; }
        .error { color: red; }

        .top-bar {
            text-align: right;
            margin-bottom: 15px;
        }

        .add-btn {
            padding: 8px 14px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        .edit {
            color: #2980b9;
            font-weight: bold;
            text-decoration: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #c0392b;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>🛏 Room Management</h2>

<p th:if="${success}" th:text="${success}" class="message success"></p>
<p th:if="${error}" th:text="${error}" class="message error"></p>

<div class="top-bar">
    <a th:href="@{/room/new}" class="add-btn">➕ Add Room</a>
    <th>


        <a th:href="@{/}" class="home-btn">🏠 Home</a>
    </th>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Room Number</th>
        <th>Type</th>
        <th>Price</th>
        <th>Status</th>
        <th>Hotel</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="r : ${rooms}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.roomNumber}"></td>
        <td th:text="${r.type}"></td>
        <td th:text="${r.pricePerNight}"></td>
        <td th:text="${r.status}"></td>
        <td>
            <a th:href="@{/hotel/find/{id}(id=${r.hotelModel.id})}"
               th:text="${r.hotelModel.name}">
            </a>
        </td>
        <td>
            <a th:href="@{/room/edit/{id}(id=${r.id})}" class="edit">✏ Edit</a>
            |
            <form th:action="@{/room/delete/{id}(id=${r.id})}"
                  method="post"
                  style="display:inline;"
                  onsubmit="return confirm('Delete this room?')">

                <input type="hidden" name="_method" value="delete"/>

                <button type="submit" class="delete-btn">
                    🗑 Delete
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
