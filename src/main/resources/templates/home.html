<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Management | Dashboard</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(255,255,255,0.08);
            --card-border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-light);
            min-height: 100vh;
        }

        /* ===== Header ===== */
        .header {
            padding: 25px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            letter-spacing: 1px;
        }

        /* ===== Container ===== */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 30px;
            padding: 50px;
        }

        /* ===== Card ===== */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                    120deg,
                    transparent,
                    rgba(56,189,248,0.15),
                    transparent
            );
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
        }

        .card i {
            font-size: 42px;
            margin-bottom: 18px;
            color: var(--accent);
        }

        .card h3 {
            margin: 10px 0 15px;
            font-size: 20px;
            color: #f8fafc;
        }

        .card a {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 6px 18px rgba(56,189,248,0.4);
        }

        .card a:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(56,189,248,0.6);
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 18px;
            background: rgba(255,255,255,0.05);
            border-top: 1px solid var(--card-border);
            font-size: 14px;
            color: #94a3b8;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
        }

    </style>
</head>

<body>

<div class="header">
    🏨 Hotel Management System
</div>

<div class="container">

    <div class="card">
        <i class="fa-solid fa-hotel"></i>
        <h3>Hotels</h3>
        <a th:href="@{/hotel/list}">Manage Hotels</a>
    </div>

    <div class="card">
        <i class="fa-solid fa-users"></i>
        <h3>Customers</h3>
        <a th:href="@{/customer/list}">Manage Customers</a>
    </div>

    <div class="card">
        <i class="fa-solid fa-bed"></i>
        <h3>Rooms</h3>
        <a th:href="@{/room/list}">Manage Rooms</a>
    </div>

    <div class="card">
        <i class="fa-solid fa-calendar-check"></i>
        <h3>Bookings</h3>
        <a th:href="@{/booking/list}">Manage Bookings</a>
    </div>

    <div class="card">
        <i class="fa-solid fa-credit-card"></i>
        <h3>Payments</h3>
        <a th:href="@{/payment/}">Manage Payments</a>
    </div>

</div>

<div class="footer">
    © 2026 Hotel ITC | Spring Boot Project
</div>

</body>
</html>
