<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied</title>

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f172a;
            font-family:Arial,sans-serif;
            color:white;
        }

        .box{
            text-align:center;
            background:rgba(255,255,255,0.08);
            padding:40px;
            border-radius:20px;
            width:450px;
        }

        h1{
            color:#ef4444;
            margin-bottom:20px;
        }

        a{
            text-decoration:none;
            color:white;
            background:#38bdf8;
            padding:12px 20px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>403 Access Denied</h1>

    <p>
        You are not authorized to access this page.
    </p>

    <br>

    <a th:href="@{/}">
        Back To Home
    </a>

</div>

</body>
</html>
