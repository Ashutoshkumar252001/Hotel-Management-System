<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Available Hotels</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#0f172a;
            color:white;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#38bdf8;
        }

        .hotel-container{
            display:grid;
            grid-template-columns:
                    repeat(auto-fit,minmax(320px,1fr));
            gap:25px;
        }

        .hotel-card{
            background:#1e293b;
            border-radius:15px;
            overflow:hidden;
            transition:0.3s;
            box-shadow:0 4px 15px rgba(0,0,0,0.3);
        }

        .hotel-card:hover{
            transform:translateY(-5px);
        }

        .hotel-image{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .hotel-body{
            padding:20px;
        }

        .hotel-name{
            font-size:24px;
            margin-bottom:10px;
            color:#38bdf8;
        }

        .hotel-info{
            margin-bottom:8px;
            color:#cbd5e1;
        }

        .price{
            font-size:22px;
            color:#22c55e;
            margin-top:15px;
            font-weight:bold;
        }

        .book-btn{
            display:inline-block;
            margin-top:18px;
            background:#38bdf8;
            color:white;
            padding:12px 20px;
            border-radius:8px;
            text-decoration:none;
            transition:0.3s;
        }

        .book-btn:hover{
            background:#0ea5e9;
        }

        .empty{
            text-align:center;
            margin-top:50px;
            font-size:22px;
            color:#f87171;
        }

    </style>

</head>

<body>

<h1>Available Hotels</h1>

<div th:if="${#lists.isEmpty(hotels)}"
     class="empty">

    No Hotels Found

</div>

<div class="hotel-container">

    <div class="hotel-card"
         th:each="hotel : ${hotels}">

        <img class="hotel-image"
             src="https://images.unsplash.com/photo-1566073771259-6a8506099945"
             alt="Hotel Image">

        <div class="hotel-body">

            <div class="hotel-name"
                 th:text="${hotel.name}">
            </div>

            <div class="hotel-info">
                Address :
                <span th:text="${hotel.address}"></span>
            </div>


            <a th:href="@{'/booking/' + ${hotel.id}}"
               class="book-btn">

                Book Now

            </a>


        </div>

    </div>

</div>

</body>
</html>
