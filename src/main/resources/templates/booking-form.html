<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Form</title>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-light);
        }

        .container {
            max-width: 520px;
            margin: auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 18px;
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text-light);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56,189,248,0.3);
        }

        select option {
            background: #020617;
            color: white;
        }

        button {
            margin-top: 28px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            box-shadow: 0 6px 18px rgba(56,189,248,0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(56,189,248,0.6);
        }

        .error {
            color: var(--danger);
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }

        .success {
            color: var(--success);
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${booking != null} ?
                   (${booking.id != null} ? 'Edit Booking' : 'New Booking')
                   : 'New Booking'">
        Booking
    </h1>

    <!-- Messages -->
    <div th:if="${error}" class="error"
         th:each="e : ${error}" th:text="${e}"></div>

    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:action="@{/admin/booking/save}" th:object="${booking}" method="post">

        <input type="hidden" th:field="*{id}" />

        <!-- Customer -->
        <label>Customer</label>
        <select th:field="*{customer.id}" required>
            <option value="">-- Select Customer --</option>
            <option th:each="c : ${customers}"
                    th:value="${c.id}"
                    th:text="${c.name}">
            </option>
        </select>

        <!-- Hotel -->
        <label>Hotel</label>
        <select id="hotelSelect" th:field="*{hotel.id}" required>
            <option value="">-- Select Hotel --</option>
            <option th:each="h : ${hotels}"
                    th:value="${h.id}"
                    th:text="${h.name}">
            </option>
        </select>

        <!-- Room -->
        <label>Room</label>
        <select id="roomSelect" th:field="*{room.id}" required>
            <option value="">-- Select Room --</option>

        </select>

        <!-- Dates -->
        <label>Check-In Date</label>
        <input type="date" th:field="*{checkInDate}" required />

        <label>Check-Out Date</label>
        <input type="date" th:field="*{checkOutDate}" required />

        <!-- Payment -->
        <label>Payment Mode</label>
        <select th:field="*{payment.paymentMode}" required>
            <option value="">-- Select Payment Mode --</option>
            <option th:each="m : ${T(com.hotel.enums.PaymentMode).values()}"
                    th:value="${m}"
                    th:text="${m}">
            </option>
        </select>

        <button type="submit">Save Booking</button>
    </form>
</div>

<script>
    document.getElementById("hotelSelect").addEventListener("change", function () {
        const hotelId = this.value;
        const roomSelect = document.getElementById("roomSelect");

        roomSelect.innerHTML = '<option value="">-- Select Room --</option>';

        if (!hotelId) return;

        fetch('/admin/booking/rooms/by-hotel/' + hotelId)
            .then(response => response.json())
            .then(data => {
                data.forEach(room => {
                    const option = document.createElement("option");
                    option.value = room.id;
                    option.text = room.roomNumber;
                    roomSelect.appendChild(option);
                });
            });
    });
</script>

</body>
</html>
