<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #facc15;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-light);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .message {
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .success { color: var(--success); }
        .error { color: var(--danger); }

        .top-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            box-shadow: 0 6px 18px rgba(56,189,248,0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.07);
            box-shadow: 0 10px 30px rgba(56,189,248,0.6);
        }

        /* ===== Table ===== */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(255,255,255,0.05);
            color: #f8fafc;
            font-weight: 600;
        }

        tr:hover {
            background: rgba(255,255,255,0.05);
        }

        /* ===== Avatar ===== */
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--accent);
        }

        /* ===== Actions ===== */
        .action-btn {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            margin: 2px;
            display: inline-block;
        }

        .edit {
            background: var(--warning);
            color: #000;
        }

        .delete {
            background: var(--danger);
            color: white;
            border: none;
            cursor: pointer;
        }

        .edit:hover,
        .delete:hover {
            opacity: 0.85;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<h2>👥 Customer Management</h2>

<p th:if="${success}" th:text="${success}" class="message success"></p>
<p th:if="${error}" th:text="${error}" class="message error"></p>

<div class="top-bar">
    <a th:href="@{/customer/new}" class="btn">➕ Add New Customer</a>
    <a th:href="@{/}" class="btn">🏠 Home</a>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>Profile</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>ID Proof</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="c : ${customers}">
            <td>
                <img src="https://i.pravatar.cc/100"
                     alt="profile"
                     class="avatar">
            </td>

            <td th:text="${c.name}"></td>
            <td th:text="${c.phone}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.idProofNumber}"></td>

            <td>
                <a th:href="@{/customer/edit/{id}(id=${c.id})}"
                   class="action-btn edit">✏ Edit</a>

                <form th:action="@{/customer/delete/{id}(id=${c.id})}"
                      method="post"
                      style="display:inline">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit"
                            class="action-btn delete"
                            onclick="return confirm('Are you sure?')">
                        🗑 Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
