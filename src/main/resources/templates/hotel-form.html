<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Form</title>

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
            --accent-dark: #0ea5e9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 30px;
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56,189,248,0.25);
        }

        select option {
            background: #020617;
            color: white;
        }

        button {
            margin-top: 22px;
            padding: 12px;
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(56,189,248,0.4);
        }

        button:hover {
            transform: scale(1.05);
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: var(--accent);
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
        .input-group{
    margin-bottom:15px;
}

.input-group input,
.input-group select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

.amenities-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
    margin-top:15px;
    margin-bottom:20px;
}

.amenities-grid label{
    background:#1e293b;
    padding:12px;
    border-radius:10px;
    color:white;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}
    </style>
</head>

<body>

<div class="container">

    <h2 th:text="${hotel.id == null ? '🏨 Add Hotel' : '✏ Edit Hotel'}"></h2>

    <form th:action="@{/admin/hotel/save}"
          th:object="${hotel}"
          method="post">

        <!-- Hidden ID for Edit -->
        <input type="hidden" th:field="*{id}" />

        <label>Hotel Name</label>
        <input type="text" th:field="*{name}" required />

        <label>Address</label>
        <input type="text" th:field="*{address}" required />

        <label>Rating</label>
        <select th:field="*{rating}" required>
            <option value="">-- Select Rating --</option>
            <option th:each="r : ${T(com.hotel.enums.HotelRating).values()}"
                    th:value="${r}"
                    th:text="${r}">
            </option>
        </select>



<h3>Amenities</h3>

<div class="amenities-grid">

    <label><input type="checkbox" th:field="*{amenities.wifi}"> WiFi</label>

    <label><input type="checkbox" th:field="*{amenities.television}"> Television</label>

    <label><input type="checkbox" th:field="*{amenities.telephone}"> Telephone</label>

    <label><input type="checkbox" th:field="*{amenities.restaurant}"> Restaurant</label>

    <label><input type="checkbox" th:field="*{amenities.swimmingPool}"> Swimming Pool</label>

    <label><input type="checkbox" th:field="*{amenities.gym}"> Gym</label>

    <label><input type="checkbox" th:field="*{amenities.airportShuttle}"> Airport Shuttle</label>

    <label><input type="checkbox" th:field="*{amenities.freeParking}"> Free Parking</label>

    <label><input type="checkbox" th:field="*{amenities.carRental}"> Car Rental</label>

    <label><input type="checkbox" th:field="*{amenities.cctvSecurity}"> CCTV Security</label>

    <label><input type="checkbox" th:field="*{amenities.privateBalcony}"> Private Balcony</label>

    <label><input type="checkbox" th:field="*{amenities.jacuzzi}"> Jacuzzi</label>

    <label><input type="checkbox" th:field="*{amenities.oceanView}"> Ocean View</label>

    <label><input type="checkbox" th:field="*{amenities.privateBedding}"> Private Bedding</label>

</div>

        <button type="submit"
                th:text="${hotel.id == null ? 'Save Hotel' : 'Update Hotel'}">
        </button>

        <a th:href="@{/admin/hotel/list}">Cancel</a>

    </form>

</div>

</body>
</html>
