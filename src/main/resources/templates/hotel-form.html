<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #3498db;
            border: none;
            color: white;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>

<body>

<div class="container">

    <h2 th:text="${hotel.id == null ? 'Add Hotel' : 'Edit Hotel'}"></h2>

    <form th:action="@{/hotel/save}"
          th:object="${hotel}"
          method="post">

        <!-- Hidden ID for Edit -->
        <input type="hidden" th:field="*{id}" />

        <label>Hotel Name</label>
        <input type="text" th:field="*{name}" required />

        <label>Address</label>
        <input type="text" th:field="*{address}" required />

        <label>Rating</label>
        <select th:field="*{rating}" required>
            <option value="">-- Select Rating --</option>
            <option th:each="r : ${T(com.hotel_itc.enums.HotelRating).values()}"
                    th:value="${r}"
                    th:text="${r}">
            </option>
        </select>

        <button type="submit"
                th:text="${hotel.id == null ? 'Save Hotel' : 'Update Hotel'}">
        </button>

        <a th:href="@{/hotel/list}">Cancel</a>

    </form>

</div>

</body>
</html>
