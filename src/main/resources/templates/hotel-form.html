<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 40%;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h2 th:text="${hotel.id == null ? 'New Hotel' : 'Edit Hotel'}"></h2>

    <form th:action="@{/hotel/save}"
          th:object="${hotel}"
          method="post">

        <!-- Hidden ID for Edit -->
        <input type="hidden" th:field="*{id}" />

        <label>Hotel Name</label>
        <input type="text" th:field="*{name}" required />

        <label>Address</label>
        <input type="text" th:field="*{address}" required />

        <label>Rating</label>
        <select th:field="*{rating}" required>
            <option value="">-- Select Rating --</option>
            <option th:each="r : ${T(com.hotel_itc.enums.HotelRating).values()}"
                    th:value="${r}"
                    th:text="${r}">
            </option>
        </select>

        <button type="submit">
            Save Hotel
        </button>

    </form>
</div>

</body>
</html>
