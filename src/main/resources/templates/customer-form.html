<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #27ae60;
            border: none;
            color: white;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>
<body>

<div class="container">

    <h2 th:text="${customer.id == null ? 'Add Customer' : 'Edit Customer'}"></h2>

    <form th:action="@{/customer/save}"
          th:object="${customer}"
          method="post">

        <!-- hidden id for update -->
        <input type="hidden" th:field="*{id}"/>

        <label>Name</label>
        <input type="text" th:field="*{name}" required/>

        <label>Phone</label>
        <input type="text" th:field="*{phone}" required/>

        <label>Email</label>
        <input type="email" th:field="*{email}" required/>

        <label>ID Proof</label>
        <input type="text" th:field="*{idProofNumber}" required/>

        <button type="submit"
                th:text="${customer.id == null ? 'Save Customer' : 'Update Customer'}">
        </button>

        <!-- cancel -->
        <a th:href="@{/customer/list}">Cancel</a>

    </form>

</div>

</body>
</html>
