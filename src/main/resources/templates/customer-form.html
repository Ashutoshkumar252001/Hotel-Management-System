<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Form</title>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
            --success: #22c55e;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-light);
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 18px;
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text-light);
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56,189,248,0.3);
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, var(--success), #16a34a);
            box-shadow: 0 6px 18px rgba(34,197,94,0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(34,197,94,0.6);
        }

        a {
            display: block;
            text-align: center;
            margin-top: 12px;
            text-decoration: none;
            font-weight: 600;
            color: var(--accent);
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2 th:text="${customer.id == null ? 'Add Customer' : 'Edit Customer'}"></h2>

    <form th:action="@{/customer/save}"
          th:object="${customer}"
          method="post">

        <input type="hidden" th:field="*{id}"/>

        <label>Name</label>
        <input type="text" th:field="*{name}" required/>

        <label>Phone</label>
        <input type="text" th:field="*{phone}" required/>

        <label>Email</label>
        <input type="email" th:field="*{email}" required/>

        <label>ID Proof</label>
        <input type="text" th:field="*{idProofNumber}" required/>

        <button type="submit"
                th:text="${customer.id == null ? 'Save Customer' : 'Update Customer'}">
        </button>

        <a th:href="@{/customer/list}">Cancel</a>

    </form>

</div>

</body>
</html>
