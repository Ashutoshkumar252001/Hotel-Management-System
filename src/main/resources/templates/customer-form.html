<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Update Customer Profile</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .form-container{
            width:100%;
            max-width:450px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter:blur(10px);
            border-radius:15px;
            padding:30px;
            color:white;
        }

        .form-container h2{
            text-align:center;
            margin-bottom:25px;
            color:#38bdf8;
        }

        .input-box{
            margin-bottom:18px;
        }

        .input-box label{
            display:block;
            margin-bottom:6px;
            font-size:14px;
            color:#e2e8f0;
        }

        .input-box input,
        .input-box select{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            outline:none;
            background:rgba(255,255,255,0.1);
            color:white;
            font-size:14px;
        }

        .input-box input::placeholder{
            color:#cbd5e1;
        }

        .input-box input:focus,
        .input-box select:focus{
            border:1px solid #38bdf8;
        }

        select option{
            color:black;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#38bdf8;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .btn:hover{
            background:#0ea5e9;
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:15px;
            color:#cbd5e1;
            text-decoration:none;
            transition:0.3s;
        }

        .back-btn:hover{
            color:#38bdf8;
        }

    </style>

</head>

<body>

<div class="form-container">

    <h2>Update Customer Profile</h2>

    <form th:action="@{/register-user}"
          th:object="${customer}"
          method="post">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{id}">

        <div class="input-box">
            <label>Full Name</label>

            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter full name"
                   required>
        </div>

        <div class="input-box">
            <label>Username</label>

            <input type="text"
                   th:field="*{username}"
                   placeholder="Enter username"
                   readonly>
        </div>

        <div class="input-box">
            <label>Email</label>

            <input type="email"
                   th:field="*{email}"
                   placeholder="Enter email"
                   required>
        </div>

        <div class="input-box">
            <label>Phone Number</label>

            <input type="number"
                   th:field="*{phone}"
                   placeholder="Enter phone number"
                   required>
        </div>

        <div class="input-box">
            <label>ID Proof Number</label>

            <input type="text"
                   th:field="*{idProofNumber}"
                   placeholder="Enter ID proof number"
                   required>
        </div>

        <div class="input-box">
            <label>Role</label>

            <select th:field="*{role}" required>

                <option value="">Select Role</option>

                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}">
                </option>

            </select>
        </div>

        <!-- Optional Password Update -->

        <div class="input-box">
            <label>Password</label>

            <input type="password"
                   th:field="*{password}"
                   placeholder="Enter new password">
        </div>

        <button type="submit" class="btn">
            Update Profile
        </button>

    </form>

    <a th:href="@{/}"
       class="back-btn">
        ← Back To Dashboard
    </a>

</div>

</body>
</html>
