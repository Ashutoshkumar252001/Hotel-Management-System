<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .success { color: green; }
        .error { color: red; }

        .top-bar {
            text-align: center;
            margin-bottom: 20px;
        }

        .add-btn {
            padding: 10px 15px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        .edit {
            background: #f1c40f;
            padding: 5px 10px;
            text-decoration: none;
            color: black;
            border-radius: 4px;
            font-weight: bold;
        }

        .delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>📖 Booking Management</h2>

<p th:if="${success}" th:text="${success}" class="message success"></p>
<p th:if="${error}" th:text="${error}" class="message error"></p>

<div class="top-bar">
    <a th:href="@{/booking/new}" class="add-btn">➕ New Booking</a>

    <a th:href="@{/}" class="add-btn">🏠 Home</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Customer</th>
        <th>Hotel</th>
        <th>Room</th>
        <th>Check-In Date</th>
        <th>Check-Out Date</th>
        <th>Status</th>
        <th>Payment</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="b : ${bookings}">
        <td th:text="${b.id}"></td>
        <td>
            <a th:href="@{/customer/find/{id}(id=${b.customer.id})}"
               th:text="${b.customer.name}"
               style="color:#27ae60; font-weight:bold; text-decoration:none;">
            </a>
        </td>
        <td>
            <a th:href="@{/hotel/find/{id}(id=${b.hotel.id})}"
               th:text="${b.hotel.name}"
               style="color:#27ae60; font-weight:bold; text-decoration:none;">
            </a>
        </td>
        <td>
            <a th:href="@{/room/find/{id}(id=${b.room.id})}"
               th:text="${b.room.id}"
               style="color:#27ae60; font-weight:bold; text-decoration:none;">
            </a>
        </td>        <td th:text="${b.checkInDate}"></td>
        <td th:text="${b.checkOutDate}"></td>
        <td th:text="${b.status}"></td>


        <!-- PAYMENT DETAILS -->
        <td>
            <a th:if="${b.payment != null}"
               th:href="@{/payment/find/{id}(id=${b.payment.id})}"
               th:text="${b.payment.id}"
               style="color:#3498db; font-weight:bold; text-decoration:none;">
            </a>


            <span th:if="${b.payment == null}">
-
</span>
        </td>

        <td>
            <a th:href="@{/booking/edit/{id}(id=${b.id})}" class="edit">✏ Edit</a>

            <form th:action="@{/booking/delete/{id}(id=${b.id})}"
                  method="post"
                  style="display:inline;"
                  onsubmit="return confirm('Are you sure?')">

                <input type="hidden" name="_method" value="delete"/>

                <button type="submit" class="delete">🗑 Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
