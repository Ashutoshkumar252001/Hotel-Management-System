<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Register</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .register-container{
            width:100%;
            max-width:500px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px;
            padding:35px;
            color:white;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }

        .register-container h2{
            text-align:center;
            margin-bottom:30px;
            font-size:32px;
            color:#38bdf8;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size:15px;
            color:#e2e8f0;
        }

        .input-box{
            position:relative;
        }

        .input-box i{
            position:absolute;
            top:50%;
            left:15px;
            transform:translateY(-50%);
            color:#94a3b8;
        }

        .input-box input,
        .input-box select{
            width:100%;
            padding:14px 14px 14px 45px;
            border:none;
            outline:none;
            border-radius:10px;
            background:rgba(255,255,255,0.12);
            color:white;
            font-size:15px;
        }

        .input-box input::placeholder{
            color:#cbd5e1;
        }

        .input-box select option{
            color:black;
        }

        .register-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#38bdf8;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .register-btn:hover{
            background:#0ea5e9;
            transform:translateY(-2px);
        }

        .login-link{
            text-align:center;
            margin-top:20px;
            color:#cbd5e1;
        }

        .login-link a{
            color:#38bdf8;
            text-decoration:none;
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        @media(max-width:600px){

            .register-container{
                padding:25px;
            }

            .register-container h2{
                font-size:26px;
            }
        }

    </style>

</head>

<body>

<div class="register-container">

    <h2>
        <i class="fa-solid fa-hotel"></i>
        Profile Register
    </h2>

    <form th:action="@{/register-user}" method="post">

        <div class="input-group">
            <label>Full Name</label>

            <div class="input-box">
                <i class="fa-solid fa-user"></i>

                <input type="text"
                       name="name"
                       placeholder="Enter Full Name"
                       required>
            </div>
        </div>

        <div class="input-group">
            <label>Username</label>

            <div class="input-box">
                <i class="fa-solid fa-user-tag"></i>

                <input type="text"
                       name="username"
                       placeholder="Enter Username"
                       required>
            </div>
        </div>

        <div class="input-group">
            <label>Email</label>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>

                <input type="email"
                       name="email"
                       placeholder="Enter Email"
                       required>
            </div>
        </div>

        <div class="input-group">
            <label>Phone Number</label>

            <div class="input-box">
                <i class="fa-solid fa-phone"></i>

                <input type="number"
                       name="phone"
                       placeholder="Enter Phone Number"
                       required>
            </div>
        </div>

        <div class="input-group">
            <label>ID Proof Number</label>

            <div class="input-box">
                <i class="fa-solid fa-id-card"></i>

                <input type="text"
                       name="idProofNumber"
                       placeholder="Enter Aadhaar / PAN / Passport Number"
                       required>
            </div>
        </div>

        <div class="input-group">
            <label>Password</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       name="password"
                       placeholder="Enter Password"
                       required>
            </div>
        </div>

        <div class="input-group">
            <label>Role</label>

            <div class="input-box">
                <i class="fa-solid fa-user-shield"></i>

                <select name="role" required>
                    <option value="">Select Role</option>
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
        </div>

        <button type="submit" class="register-btn">
            <i class="fa-solid fa-user-plus"></i>
            Register
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a th:href="@{/}">Login</a>
    </div>

</div>

</body>
</html>
