<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Management</title>

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text-light: #e5e7eb;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-light);
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }

        .message {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .success { color: #22c55e; }
        .error { color: #ef4444; }

        .table-container {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(255,255,255,0.12);
            color: white;
            padding: 14px;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        tr:hover {
            background: rgba(255,255,255,0.06);
        }

        a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Payment Status Badges */
        .paid {
            color: #22c55e;
            font-weight: bold;
        }

        .pending {
            color: #facc15;
            font-weight: bold;
        }

        .unpaid {
            color: #ef4444;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 20px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<h2>💳 Payment Management</h2>

<p th:if="${success}" th:text="${success}" class="message success"></p>
<p th:if="${error}" th:text="${error}" class="message error"></p>

<div class="table-container">

    <table>
        <thead>
        <tr>
            <th>Payment ID</th>
            <th>Booking</th>
            <th>Amount</th>
            <th>Payment Mode</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${payments}">
            <td th:text="${p.id}"></td>

            <td>
            <span th:if="${p.booking != null}">
                <a th:href="@{/booking/find/{id}(id=${p.booking.id})}"
                   th:text="'Booking #' + ${p.booking.id}">
                </a>
            </span>
                <span th:if="${p.booking == null}">—</span>
            </td>

            <td>₹ <span th:text="${p.amount}"></span></td>

            <td th:text="${p.paymentMode}"></td>

            <td>
            <span th:text="${p.paymentStatus}"
                  th:classappend="
                    ${p.paymentStatus} == 'PAID' ? 'paid' :
                    (${p.paymentStatus} == 'PENDING' ? 'pending' : 'unpaid')">
            </span>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="5" class="empty">No payments available</td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
