<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment List</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #f6f9fc, #e9eff5);
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            margin-top: 25px;
            color: #2c3e50;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            background: #3498db;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover {
            background: #2c80b4;
        }

        .message {
            text-align: center;
            margin: 10px;
            font-weight: bold;
        }

        .success { color: green; }
        .error { color: red; }

        .table-container {
            width: 95%;
            margin: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background: #f4f6f9;
        }

        .paid {
            color: green;
            font-weight: bold;
        }

        .unpaid {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>💳 Payment Management</h2>

<p th:if="${success}" th:text="${success}" class="message success"></p>
<p th:if="${error}" th:text="${error}" class="message error"></p>

<div class="top-bar">
    <a th:href="@{/}" class="btn">🏠 Home</a>
    <a th:href="@{/booking/list}" class="btn">📘 Bookings</a>
</div>

<div class="table-container">

    <table>
        <thead>
        <tr>
            <th>Payment ID</th>
            <th>Booking ID</th>
            <th>Amount</th>
            <th>Payment Mode</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${payments}">
            <td th:text="${p.id}"></td>

                <td>
               <span th:if="${p.booking != null}">
            <a th:href="@{/booking/find/{id}(id=${p.booking.id})}"
               th:text="${p.booking.id}"
               style="color:#2980b9; font-weight:bold; text-decoration:none;">
            </a>
                </span>
                    <span th:if="${p.booking == null}">
                   -
                 </span>
                </td>

            <td th:text="${p.amount}"></td>

            <td th:text="${p.paymentMode}"></td>

            <td>
                <span th:text="${p.paymentStatus}"
                      th:classappend="${p.paymentStatus.name() == 'PAID'} ? 'paid' : 'unpaid'">
                </span>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
