<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sorted Rooms By Price</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#020617;
            color:white;
            min-height:100vh;
        }

        .header{
            background:#0f172a;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid rgba(255,255,255,.1);
        }

        .header h1{
            color:#38bdf8;
        }

        .back-btn{
            text-decoration:none;
            background:#38bdf8;
            color:white;
            padding:10px 18px;
            border-radius:10px;
        }

        .container{
            width:90%;
            max-width:1300px;
            margin:30px auto;
        }

        .sort-info{
            background:rgba(56,189,248,.12);
            border:1px solid rgba(56,189,248,.25);
            padding:15px;
            border-radius:12px;
            margin-bottom:25px;
            color:#38bdf8;
            font-weight:bold;
        }

        .room-grid{
            display:grid;
            grid-template-columns:
                    repeat(auto-fit,minmax(320px,1fr));
            gap:20px;
        }

        .room-card{
            background:#0f172a;
            border:1px solid rgba(255,255,255,.08);
            border-radius:18px;
            padding:20px;
            transition:.3s;
        }

        .room-card:hover{
            transform:translateY(-5px);
            border-color:#38bdf8;
        }

        .room-card h2{
            color:#38bdf8;
            margin-bottom:15px;
        }

        .room-card p{
            margin:10px 0;
            color:#cbd5e1;
        }

        .price{
            margin-top:15px;
            display:inline-block;
            background:rgba(34,197,94,.15);
            color:#22c55e;
            padding:8px 15px;
            border-radius:20px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>
        <i class="fa-solid fa-bed"></i>
        Room Price Sorting
    </h1>

    <a th:href="@{/}"
       class="back-btn">
        Back
    </a>

</div>

<div class="container">

    <div class="sort-info">

        <i class="fa-solid fa-arrow-down-wide-short"></i>

        Sorted By :
        <span th:text="${field}"></span>

    </div>

    <div class="room-grid">

        <div class="room-card"
             th:each="room : ${rooms}">

            <h2 th:text="${room.hotel.name}">
                Hotel Name
            </h2>

            <p>
                <i class="fa-solid fa-door-open"></i>
                Room No :
                <span th:text="${room.roomNumber}">
                </span>
            </p>

            <p>
                <i class="fa-solid fa-bed"></i>
                Type :
                <span th:text="${room.type}">
                </span>
            </p>

            <p>
                <i class="fa-solid fa-circle-check"></i>
                Status :
                <span th:text="${room.status}">
                </span>
            </p>

            <div class="price">

                <i class="fa-solid fa-indian-rupee-sign"></i>

                <span th:text="${room.pricePerNight}">
                    2500
                </span>
                / Night

            </div>

        </div>

    </div>

</div>

</body>
</html>
