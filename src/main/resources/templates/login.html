<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login</title>

  <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#0f172a,#1e293b);
    }

    .login-box{
        width:400px;
        background:rgba(255,255,255,0.08);
        border:1px solid rgba(255,255,255,0.15);
        padding:40px;
        border-radius:20px;
        backdrop-filter:blur(12px);
        color:white;
        box-shadow:0 8px 30px rgba(0,0,0,0.3);
    }

    .login-box h1{
        text-align:center;
        margin-bottom:30px;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        margin-bottom:8px;
    }

    .form-group input{
        width:100%;
        padding:12px;
        border:none;
        border-radius:10px;
        outline:none;
    }

    .btn{
        width:100%;
        padding:12px;
        border:none;
        border-radius:10px;
        background:#38bdf8;
        color:white;
        font-size:16px;
        cursor:pointer;
    }

    .btn:hover{
        background:#0ea5e9;
    }

    .message{
        text-align:center;
        margin-bottom:15px;
        color:#22c55e;
    }

    .error{
        text-align:center;
        margin-bottom:15px;
        color:#ef4444;
    }

    .register-link{
        text-align:center;
        margin-top:20px;
    }

    .register-link a{
        color:#38bdf8;
        text-decoration:none;
    }

  </style>

</head>

<body>

<div class="login-box">

  <h1>Hotel Management Login</h1>

  <div class="message" th:if="${success}" th:text="${success}"></div>

  <div class="error" th:if="${error}" th:text="${error}"></div>

  <form th:action="@{/login}" method="post">

    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>

    <button type="submit" class="btn">
      Login
    </button>

  </form>

  <div class="register-link">
    Don't have account ?
    <a th:href="@{/register}">
      Register
    </a>
  </div>

</div>

</body>
</html>
